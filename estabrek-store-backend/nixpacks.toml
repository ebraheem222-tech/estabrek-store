[phases.setup]
nixPkgs = ["nodejs_20", "openssl", "vips", "python3", "gcc", "gnumake", "pkg-config"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps --include=dev"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "(test -f dist/server.js || npm run build) && node dist/server.js"
